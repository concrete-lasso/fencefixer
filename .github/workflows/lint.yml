name: Python Linting

# This configuration ensures the action triggers on ALL branches
on:
  push:
    branches:
      - '**'        # Matches every branch and nested branch (e.g., feature/login)
  pull_request:     # Optional: Runs on PRs targeting any branch

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install the Ruff linter
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # 4. Run the linter over the entire codebase
      - name: Run Ruff Linting
        run: ruff check .
